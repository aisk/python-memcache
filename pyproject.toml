[project]
name = "memcache"
version = "0.14.0"
description = "Memcached client for Python"
authors = [{ name = "AN Long", email = "aisk1988@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "hashring>=1.5.1,<2",
    "anyio>=3.0.0,<4.0.0",
    "backports.zstd>=1.0.0 ; python_version < '3.14'",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "black>=24.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio[trio]>=3.0.0,<4.0.0 ; python_version < '3.13'",
    "pytest-trio ; python_version < '3.13'",
    "trio-typing>=0.10.0 ; python_version < '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
